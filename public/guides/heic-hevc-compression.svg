<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="HEIC uses HEVC compression compared to JPEG">
  <rect width="720" height="480" fill="#fafafa"/>
  <text x="360" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#111">Same photo · different container</text>
  <rect x="60" y="80" width="280" height="280" rx="12" fill="#fff" stroke="#ddd"/>
  <text x="200" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#111">HEIC / HEIF</text>
  <text x="200" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#666">H.265 / HEVC still frame</text>
  <rect x="100" y="168" width="200" height="120" rx="8" fill="#e8f4ff" stroke="#0071e3"/>
  <text x="200" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#0071e3">~1.8 MB</text>
  <text x="200" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">typical 12 MP iPhone shot</text>
  <text x="200" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">iPhone default · smaller iCloud sync</text>
  <rect x="380" y="80" width="280" height="280" rx="12" fill="#fff" stroke="#ddd"/>
  <text x="520" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#111">JPEG</text>
  <text x="520" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#666">Legacy DCT compression</text>
  <rect x="420" y="168" width="200" height="120" rx="8" fill="#fff5e6" stroke="#f5a623"/>
  <text x="520" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#e67e22">~3.6 MB</text>
  <text x="520" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">same scene · similar look</text>
  <text x="520" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">Opens everywhere · email-safe</text>
  <path d="M340 220 h40" stroke="#50e3c2" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#50e3c2"/></marker></defs>
  <text x="360" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0d6b55">convert</text>
  <rect x="80" y="392" width="560" height="56" rx="8" fill="#f0fdf9" stroke="#50e3c2"/>
  <text x="360" y="424" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">HEVC inside HEIC saves space on iPhone; JPG trades size for universal compatibility</text>
</svg>
