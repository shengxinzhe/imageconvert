<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Install HEIF Image Extensions on Windows">
  <rect width="720" height="480" fill="#f3f3f3"/>
  <rect x="40" y="40" width="640" height="400" rx="12" fill="#fff" stroke="#e0e0e0"/>
  <text x="72" y="88" font-family="Segoe UI,system-ui,sans-serif" font-size="22" font-weight="600" fill="#111">Microsoft Store</text>
  <rect x="72" y="108" width="576" height="44" rx="8" fill="#f5f5f5" stroke="#ddd"/>
  <text x="96" y="136" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#888">Search: HEIF Image Extensions</text>
  <rect x="72" y="176" width="576" height="96" rx="8" fill="#fafafa" stroke="#0078d4" stroke-width="2"/>
  <rect x="88" y="192" width="64" height="64" rx="8" fill="#0078d4"/>
  <text x="120" y="232" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="22" fill="#fff">HEIF</text>
  <text x="168" y="214" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="600" fill="#111">HEIF Image Extensions</text>
  <text x="168" y="236" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#666">Microsoft Corporation · Free</text>
  <text x="168" y="254" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#666">Opens .heic in Photos and Explorer thumbnails</text>
  <rect x="520" y="204" width="96" height="36" rx="4" fill="#0078d4"/>
  <text x="568" y="227" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#fff">Get</text>
  <rect x="72" y="296" width="576" height="120" rx="8" fill="#1e1e1e"/>
  <text x="96" y="328" font-family="Consolas,monospace" font-size="14" fill="#d4d4d4">PS&gt; winget install Microsoft.HEIFImageExtension</text>
  <text x="96" y="358" font-family="Consolas,monospace" font-size="13" fill="#6a9955"># Or install from Microsoft Store if winget is blocked</text>
  <text x="96" y="392" font-family="Segoe UI,sans-serif" font-size="12" fill="#888">HEVC extension may be required for some iPhone color profiles (paid on some PCs)</text>
</svg>
